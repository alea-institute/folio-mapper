[project]
name = "folio-mapper-backend"
version = "0.1.1"
description = "FOLIO Mapper backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    # U10's cross-stack gate fails closed on folio-python version skew. Match the released
    # folio-enrich incumbent so both deterministic lanes use the same ontology implementation.
    "folio-python==0.3.6",
    "alea-llm-client>=0.2.0,<1.0.0",
    "rapidfuzz>=3.0.0,<4.0.0",
    "marisa-trie>=1.0.0,<2.0.0",
    "openai>=1.0.0,<2.0.0",
    "anthropic>=0.18.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "slowapi>=0.1.9,<1.0.0",
    # Shared FOLIO source-text->concept matching engine (folio-resolve migration SCHEDULE.md
    # row 3). folio-mapper is the DONOR of this library's scorer/expansions/judge rules; it now
    # consumes them back instead of owning the fork. Resolved from PyPI (MIT, Damien's own).
    # EXACT pin, deliberately: this backend used to run an editable install onto the
    # ../../folio-resolve working tree, so its behavior silently tracked whatever branch was
    # checked out there. 0.3.1 carries the determinism corrections (folio-resolve
    # docs/migration/2026-08-05-v0.3.1-consumer-impact.md §4.2 — F13 reorders one row of
    # migration/captures/*.json search_terms), so the version must be a reviewable edit here.
    # 0.4.0 adds deterministic recall as an opt-in capability; this consumer's default path remains
    # unchanged. For local library dev, use a throwaway venv — do NOT `uv pip install -e` into this one.
    "folio-resolve==0.4.0",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.0,<4.0",
    "faiss-cpu>=1.8,<2.0",
    "numpy>=1.26,<3.0",
]
nlp = [
    "spacy>=3.7,<4.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
